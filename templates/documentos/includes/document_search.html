<form class="document-search-form" method="get" action="{% url 'documentos:list' %}" role="search">
    <input type="hidden" name="estado" value="{{ selected_status|default:'all' }}">
    <label class="document-search" for="document-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
        <input id="document-search" name="q" type="search" value="{{ q }}" placeholder="Buscar por nombre o descripción" aria-label="Buscar por nombre o descripción" data-document-search>
    </label>
    <button class="document-search-submit" type="submit">Buscar</button>
    {% if q %}<a class="text-link" href="{% url 'documentos:list' %}?estado={{ selected_status|default:'all' }}">Limpiar búsqueda</a>{% endif %}
</form>
